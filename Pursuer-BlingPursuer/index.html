<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>JSAB: EXTENDED DASH</title>
    <style>
        body { margin: 0; overflow: hidden; background: #050000; font-family: 'Arial Black', sans-serif; }
        canvas { display: block; }
        #ui { 
            position: absolute; top: 30px; left: 40px; color: #00f2ff; 
            text-transform: uppercase; letter-spacing: 5px; pointer-events: none;
            text-shadow: 0 0 15px #00f2ff;
        }
        #stage-name { font-size: 40px; margin: 0; }
        #instruction { position: absolute; bottom: 20px; left: 40px; color: #777; font-size: 14px; }
        .bonus-active { color: #fff; text-shadow: 0 0 20px #fff; animation: blink 0.1s infinite; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }
    </style>
</head>
<body>
    <div id="ui">
        <h1 id="stage-name">TRACK 01: MOMENTUM</h1>
        <div id="status">DASH: <span style="color: #fff;">EXTENDED BURST</span></div>
        <div id="dash-bonus" style="font-size: 18px; margin-top: 10px; color: #ff0000; display: none;">BONUS JUMP READY</div>
    </div>
    <div id="instruction">W: DOUBLE JUMP | SPACE: DASH (3S INVINCIBLE) | A, D: MOVE</div>
    <canvas id="gameCanvas"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const player = {
    x: 100, y: 700, w: 28, h: 28,
    vx: 0, vy: 0, 
    speed: 10.5,
    jumpPower: 20,
    gravity: 0.8,
    grounded: false,
    facing: 1,
    jumpsAvailable: 2,
    extraDashJump: false,
    invinc: 0,
    dashTimer: 0,
    trail: []
};

const COLOR_PLAYER = "#00f2ff";
const COLOR_HAZARD = "#ff0000";
const COLOR_GOAL = "#ffff00";

let shakeAmount = 0;
let frameCount = 0;
let currentLevel = 0;
const bars = Array.from({length: 50}, () => ({ h: 0, targetH: 0 }));

const stages = [
    {
        name: "01: PRECISION",
        platforms: [
            {x: 0, y: 800, w: 400, h: 100},
            {x: 1400, y: 400, w: 100, h: 500, type: 'goal'}
        ],
        hazards: [
            {x: 400, y: 850, w: 1100, h: 50},
            {x: 750, y: 500, w: 60, h: 400}, 
            {x: 1100, y: 0, w: 60, h: 500} 
        ]
    },
    {
        name: "02: MID BURST",
        platforms: [
            {x: 50, y: 800, w: 200, h: 50},
            {x: 1600, y: 200, w: 100, h: 100, type: 'goal'}
        ],
        hazards: [
            {x: 300, y: 650, w: 40, h: 150},
            {x: 600, y: 650, w: 40, h: 150},
            {x: 900, y: 650, w: 40, h: 150},
            {x: 1200, y: 650, w: 40, h: 150},
            {x: 300, y: 830, w: 1500, h: 50}
        ]
    },
    {
        name: "03: AGILITY TEST",
        platforms: [
            {x: 100, y: 850, w: 200, h: 50},
            {x: 100, y: 200, w: 100, h: 100, type: 'goal'}
        ],
        hazards: [
            {x: 400, y: 700, w: 1200, h: 30},
            {x: 0, y: 500, w: 1200, h: 30},
            {x: 400, y: 300, w: 1200, h: 30},
            {x: 350, y: 300, w: 30, h: 500}
        ]
    }
];

const keys = {};
const particles = [];

window.addEventListener('keydown', e => {
    keys[e.code] = true;
    
    if(e.code === 'KeyW') {
        if(player.grounded) {
            player.vy = -player.jumpPower;
            player.grounded = false;
            player.jumpsAvailable = 1;
        } else if(player.jumpsAvailable > 0) {
            player.vy = -player.jumpPower * 0.9;
            player.jumpsAvailable--;
            createParticles(player.x, player.y, COLOR_PLAYER, 10);
        } else if(player.extraDashJump && player.invinc > 0) {
            player.vy = -player.jumpPower * 0.9;
            player.extraDashJump = false;
            shakeAmount = 10;
            createParticles(player.x, player.y, "#fff", 15);
        }
    }
    
    if(e.code === 'Space') {
        // ★ 대쉬 거리 조정됨
        player.dashTimer = 10;  
        player.vx = player.facing * 35; 
        player.vy = 0;          
        player.invinc = 180;    
        player.extraDashJump = true; 
        shakeAmount = 12;
        createParticles(player.x, player.y, "#fff", 15);
    }
});
window.addEventListener('keyup', e => keys[e.code] = false);

function createParticles(x, y, color, count) {
    for(let i=0; i<count; i++) {
        particles.push({
            x: x + 14, y: y + 14,
            vx: (Math.random()-0.5)*15, 
            vy: (Math.random()-0.5)*15, 
            size: Math.random()*6 + 2,
            life: 1.0, color
        });
    }
}

function reset() {
    player.x = 100; player.y = 700;
    player.vx = 0; player.vy = 0;
    player.invinc = 0;
    player.dashTimer = 0;
    player.jumpsAvailable = 2;
    player.extraDashJump = false;
    shakeAmount = 25;
}

function update() {
    frameCount++;
    
    bars.forEach(bar => {
        if(frameCount % 30 === 0) bar.targetH = Math.random() * 250;
        bar.h += (bar.targetH - bar.h) * 0.1;
    });

    if (player.dashTimer > 0) {
        player.dashTimer--;
        player.vy = 0; 
    } else {
        if (keys['KeyA']) { player.vx = -player.speed; player.facing = -1; }
        else if (keys['KeyD']) { player.vx = player.speed; player.facing = 1; }
        else { player.vx *= 0.85; }
        player.vy += player.gravity;
    }

    player.x += player.vx;
    player.y += player.vy;

    if (player.invinc > 0) player.invinc--;
    else player.extraDashJump = false;

    if (player.invinc > 0 || player.dashTimer > 0) {
        player.trail.push({x: player.x, y: player.y, life: 12});
    }
    player.trail = player.trail.filter(t => t.life-- > 0);

    const lvl = stages[currentLevel];
    player.grounded = false;

    lvl.platforms.forEach(p => {
        if (player.x + player.w > p.x && player.x < p.x + p.w &&
            player.y + player.h > p.y && player.y + player.h < p.y + player.vy + 15 && player.vy >= 0) {
            player.y = p.y - player.h;
            player.vy = 0;
            player.grounded = true;
            player.jumpsAvailable = 2;
        }
        if (p.type === 'goal' && player.x < p.x + p.w && player.x + player.w > p.x &&
            player.y < p.y + p.h && player.y + player.h > p.y) {
            currentLevel = (currentLevel + 1) % stages.length;
            document.getElementById('stage-name').innerText = "TRACK: " + stages[currentLevel].name;
            reset();
        }
    });

    if (player.invinc <= 0) {
        lvl.hazards.forEach(h => {
            const pad = 5;
            if (player.x + pad < h.x + h.w && player.x + player.w - pad > h.x &&
                player.y + pad < h.y + h.h && player.y + player.h - pad > h.y) {
                reset();
            }
        });
    }

    if (player.y > canvas.height + 100) reset();
    if (shakeAmount > 0) shakeAmount *= 0.9;

    draw();
    requestAnimationFrame(update);
}

function draw() {
    ctx.fillStyle = "#050000";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.save();
    if (shakeAmount > 0.5) ctx.translate((Math.random()-0.5)*shakeAmount, (Math.random()-0.5)*shakeAmount);

    bars.forEach((bar, i) => {
        ctx.fillStyle = `rgba(255, 0, 0, ${0.03 + bar.h/1200})`;
        const w = canvas.width / bars.length;
        ctx.fillRect(i * w, canvas.height - bar.h, w - 4, bar.h);
    });

    const lvl = stages[currentLevel];
    lvl.platforms.forEach(p => {
        ctx.shadowBlur = 10; ctx.shadowColor = COLOR_PLAYER;
        ctx.fillStyle = p.type === 'goal' ? COLOR_GOAL : "#001a22";
        ctx.fillRect(p.x, p.y, p.w, p.h);
        if(!p.type) { ctx.strokeStyle = COLOR_PLAYER; ctx.strokeRect(p.x, p.y, p.w, p.h); }
    });

    lvl.hazards.forEach(h => {
        ctx.shadowBlur = 25; ctx.shadowColor = COLOR_HAZARD;
        ctx.fillStyle = COLOR_HAZARD;
        ctx.fillRect(h.x, h.y, h.w, h.h);
        ctx.fillStyle = "#ff7777";
        ctx.fillRect(h.x + 4, h.y + 4, Math.max(0, h.w - 8), Math.max(0, h.h - 8));
    });

    player.trail.forEach(t => {
        ctx.fillStyle = `rgba(0, 242, 255, ${t.life / 15})`;
        ctx.fillRect(t.x, t.y, player.w, player.h);
    });

    const isSpecial = player.invinc > 0;
    ctx.shadowBlur = isSpecial ? 40 : 15;
    ctx.shadowColor = isSpecial ? "#fff" : COLOR_PLAYER;
    ctx.fillStyle = isSpecial ? "#fff" : COLOR_PLAYER;
    ctx.fillRect(player.x, player.y, player.w, player.h);

    particles.forEach((p, i) => {
        p.x += p.vx; p.y += p.vy; p.life -= 0.02;
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.life;
        ctx.fillRect(p.x, p.y, p.size, p.size);
        if(p.life <= 0) particles.splice(i, 1);
    });

    ctx.restore();

    const dashBonus = document.getElementById('dash-bonus');
    if(isSpecial && player.extraDashJump) {
        dashBonus.style.display = "block";
        dashBonus.className = "bonus-active";
    } else {
        dashBonus.style.display = "none";
    }
}

update();
</script>
</body>
</html>
