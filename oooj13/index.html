<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="oooj13 학생의 Nodeboard 커뮤니티 게시판 프로젝트 안내입니다.">
  <title>Nodeboard | 커뮤니티 게시판 프로젝트</title>
  <style>
    :root { color-scheme: dark; --ink:#eef2ff; --muted:#aeb8cf; --line:#2d3958; --accent:#70e0c0; --panel:#151d31; }
    * { box-sizing:border-box; } body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; color:var(--ink); background:radial-gradient(circle at top right,#273b70,transparent 44%),#0b1020; font-family:system-ui,sans-serif; }
    main { width:min(100%,680px); padding:clamp(28px,7vw,64px); border:1px solid var(--line); border-radius:22px; background:rgba(21,29,49,.9); box-shadow:0 24px 70px #0006; }
    .tag { color:var(--accent); font-size:13px; font-weight:700; letter-spacing:.08em; } h1 { margin:16px 0 12px; font-size:clamp(34px,8vw,56px); letter-spacing:-.06em; } p { color:var(--muted); line-height:1.7; } code { display:block; margin:24px 0 12px; padding:15px 18px; overflow:auto; border-radius:10px; color:#dfffee; background:#0a0f1d; font-family:ui-monospace,monospace; } a { color:var(--ink); } .back { display:inline-block; margin-top:24px; color:var(--accent); font-weight:700; text-decoration:none; }
  </style>
</head>
<body>
  <main>
    <div class="tag">OOOJ13 · COMMUNITY PROJECT</div>
    <h1>Nodeboard</h1>
    <p>글쓰기, 댓글, 좋아요를 구현한 Node.js·Express·React 기반 커뮤니티 게시판입니다.</p>
    <p>이 작품은 서버 API가 필요하므로 GitHub Pages 같은 정적 호스팅에서는 데이터 저장 기능을 제공하지 않습니다. 프로젝트 폴더에서 아래 명령으로 실행할 수 있습니다.</p>
    <code>npm install<br>npm run dev</code>
    <p>실행 뒤 <code style="display:inline;margin:0;padding:2px 6px">http://localhost:3000</code>에서 게시판을 이용할 수 있습니다.</p>
    <a class="back" href="../">← 작품 허브로 돌아가기</a>
  </main>
</body>
</html>
